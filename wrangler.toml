name = "runsonmypc"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# --------------------------------------------------------------------------
# Cloudflare account: Abdellatifox1000 (949a7a3e262ac7c7426f3059286ae26d),
# zone runsonmypc.com. This is NOT the PCGameFit account — never point these
# ids at that one, and never touch anything named critvolt-*.
#
# Run wrangler through the token wrapper so it cannot reach the wrong account:
#   npm run cf -- whoami
#   npm run deploy
#   npm run db:migrate
#
# KV titles carry a doubled prefix ("runsonmypc-runsonmypc-tools") because
# wrangler v3 prefixes namespace titles with the project name. Cosmetic only —
# bindings resolve by id.
# --------------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "runsonmypc-db"
database_id = "7761340a-abd4-4981-aed9-b52e7fe496d4"
migrations_dir = "migrations"

# Caches tool and autocomplete results. Optional: the APIs query directly when
# this namespace is missing or erroring.
[[kv_namespaces]]
binding = "TOOLS_KV"
id = "b9708169e6834cf5845ba3c141ee1f61"

# Required by @astrojs/cloudflare's session support. Without it the build
# warns "Invalid binding `SESSION`".
[[kv_namespaces]]
binding = "SESSION"
id = "9b11163446884c7fb8284374011fc488"

# R2 is deliberately unused. Game art ships as Pages static assets, which the
# same edge serves with no egress cost and no Worker invocation.
#
# Revisit near Pages' 20,000-file cap (~5.9 files per game, so ~3,300 games).
# Before switching: create a Cache Rule for the CDN hostname (R2 custom-domain
# traffic is not edge-cached without one), then set ART_BASE in src/lib/site.ts.
#
# [[r2_buckets]]
# binding = "ART_R2"
# bucket_name = "runsonmypc-assets"
