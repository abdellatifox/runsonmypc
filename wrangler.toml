name = "runsonmypc"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# --------------------------------------------------------------------------
# The ids below are placeholders until phase 05 creates the resources. Run
# `npx wrangler whoami` first and confirm it is this site's account — never
# the PCGameFit account's resources and never anything named critvolt-*.
#
#   npx wrangler d1 create runsonmypc-db
#   npx wrangler kv namespace create runsonmypc-tools
#   npx wrangler kv namespace create runsonmypc-session
#
# then paste the ids each command prints into the matching field.
#
# The site degrades gracefully without them: src/lib/db.ts falls back to the
# bundled rows, and the tool APIs skip the cache when TOOLS_KV is missing.
# --------------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "runsonmypc-db"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

# Caches tool and autocomplete results. Optional: the APIs query directly when
# this namespace is missing or erroring.
[[kv_namespaces]]
binding = "TOOLS_KV"
id = "REPLACE_WITH_TOOLS_KV_ID"

# Required by @astrojs/cloudflare's session support. Without it the build
# warns "Invalid binding `SESSION`".
[[kv_namespaces]]
binding = "SESSION"
id = "REPLACE_WITH_SESSION_KV_ID"

# R2 is deliberately unused. Game art ships as Pages static assets, which the
# same edge serves with no egress cost and no Worker invocation.
#
# Revisit near Pages' 20,000-file cap (~5.9 files per game, so ~3,300 games).
# Before switching: create a Cache Rule for the CDN hostname (R2 custom-domain
# traffic is not edge-cached without one), then set ART_BASE in src/lib/site.ts.
#
# [[r2_buckets]]
# binding = "ART_R2"
# bucket_name = "runsonmypc-assets"
