<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="RunsOnMyPC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151B30"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8E7DFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8E7DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="930" cy="170" r="360" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#8E7DFF"/>
  <g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
